# ============================================================
# auto-trade-ai Settings
# ============================================================

# --- Data Sources ---
data:
  # Gold (XAUUSD) — real API or demo
  gold:
    provider: "alpha_vantage"  # real data source
    api_key: "${ALPHA_VANTAGE_API_KEY}"  # set in .env
    demo_mode: false  # set true only if no API key
    cache_ttl: 60  # seconds

  # Crypto — real data from Binance
  crypto:
    provider: "binance"
    testnet: false  # set true for paper trading on testnet

# --- Wallets ---
wallets:
  paper:
    initial_balance: 100000.0  # USDT
    currency: "USDT"
    enabled: true

  live:
    currency: "USDT"
    enabled: true
    # Balance pulled from exchange API at runtime
    # Set exchange API keys in .env

# --- Trading Rules ---
trading:
  risk:
    max_position_pct: 0.10      # max 10% of wallet per trade
    stop_loss_pct: 0.02         # -2% stop loss
    take_profit_pct: 0.05       # +5% take profit
    confidence_threshold: 0.75   # AI confidence >= 0.75

  assets:
    gold:
      symbols: ["XAUUSD"]
      max_positions: 2          # simultaneous positions
    crypto:
      symbols: ["BTCUSDT", "ETHUSDT"]
      max_positions: 3

# --- AI Signal Generation ---
ai:
  model: "gpt-4o"
  provider: "openai"
  api_key: "${OPENAI_API_KEY}"  # set in .env
  system_prompt: "config/system_prompt.md"

  # Technical analysis settings
  technical:
    indicators:
      - "RSI"
      - "MACD"
      - "Bollinger Bands"
      - "Moving Averages"
    default_interval: "1h"
    lookback_periods: 100

# --- Exchange API Keys (LIVE trading) ---
exchange:
  binance:
    api_key: "${BINANCE_API_KEY}"
    api_secret: "${BINANCE_API_SECRET}"
    testnet: false  # set true to use Binance testnet

# --- Logging ---
logging:
  level: "INFO"
  trades_db: "data/trades.db"
  signals_log: "data/signals.log"
